<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0A1411">
<title>Мой день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<!--BODY-START-->
<style>
/* Layout: одна колонка до 480px, блоки сверху вниз, золотая кнопка закреплена внизу */
:root {
  color-scheme: dark;
  --bg: #0A1411;
  --bg-glow: rgba(46, 139, 106, 0.22);
  --card: #12221C;
  --card-2: #182C25;
  --line: rgba(214, 182, 112, 0.22);
  --line-soft: rgba(244, 240, 230, 0.08);
  --gold: #D6B670;
  --gold-2: #F0D79A;
  --gold-ink: #1B1508;
  --emerald: #2E8B6A;
  --emerald-soft: rgba(46, 139, 106, 0.2);
  --text: #F4F0E6;
  --muted: #A3B6AC;
  --faint: #6F857A;
  --pink: #F28BAE;
  --overlay: rgba(4, 9, 7, 0.72);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --r: 18px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 100% 0%, var(--bg-glow), transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 120px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Шапка */
.top { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.date { margin: 0; display: flex; flex-direction: column; gap: 2px; text-wrap: balance; }
.date .wd { font-size: 30px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; text-transform: capitalize; }
.date .dm { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; color: var(--gold-2); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.daytype {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--emerald-soft); border: 1px solid rgba(46,139,106,.45);
  border-radius: 999px; padding: 7px 12px 7px 14px; font-size: 13px; font-weight: 600;
}
.daytype svg { width: 12px; height: 12px; stroke: var(--gold); }
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-text { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-text b { color: var(--text); font-weight: 700; }
.bar { height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width .5s ease; }

/* Неделя: мягкая серия и сердечки */
.week {
  display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 12px 14px;
}
.week-dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wdot { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wdot i {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line); background: transparent;
}
.wdot i svg { width: 11px; height: 11px; fill: var(--gold-ink); opacity: 0; }
.wdot.on i { background: linear-gradient(180deg, var(--gold-2), var(--gold)); border-color: var(--gold); }
.wdot.on i svg { opacity: 1; }
.wdot.today i { box-shadow: 0 0 0 3px rgba(214,182,112,.22); }
.wdot small { font-size: 10.5px; color: var(--faint); font-weight: 600; letter-spacing: .04em; }
.wdot.today small { color: var(--gold-2); }
.week-text { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week-text b { color: var(--text); }
.week-text .h { display: inline-flex; align-items: center; gap: 5px; }
.week-text .h svg { width: 12px; height: 12px; fill: var(--pink); }

/* Секции */
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.sec-count { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.sec-hint { margin: -6px 0 0; font-size: 13px; color: var(--faint); }

/* Отметка: кружок → розовое сердце */
.mark {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--gold); display: grid; place-items: center;
  transition: border-color .2s, background .2s;
}
.mark svg { width: 15px; height: 15px; fill: var(--pink); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); }
.mark.double { width: 34px; border-radius: 999px; }
.mark.double svg { width: 12px; height: 12px; margin: 0 -1px; }
.mark.double { display: flex; align-items: center; justify-content: center; }
.is-done .mark { border-color: var(--pink); background: rgba(242,139,174,.12); }
.is-done .mark svg { opacity: 1; transform: scale(1); }
.is-done .item-title { text-decoration: line-through; text-decoration-color: rgba(244,240,230,.4); color: var(--faint); }

/* Главное */
.focus-list { display: flex; flex-direction: column; gap: 10px; }
.focus {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: linear-gradient(160deg, var(--card-2), var(--card));
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; min-height: 64px;
}
.focus-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.focus .item-title { font-size: 16px; font-weight: 650; line-height: 1.3; }
.focus.is-hard { border-color: rgba(242,139,174,.5); background: linear-gradient(160deg, #24302A, var(--card)); }
.focus.is-done { border-color: var(--line-soft); }
.badge { align-self: flex-start; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.badge.hard { color: var(--pink); background: rgba(242,139,174,.12); }
.badge.carried { color: var(--muted); background: var(--line-soft); }
.link-inline { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--gold-2); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.all-done { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gold-2); font-family: var(--serif); font-style: italic; }
.all-done svg { width: 16px; height: 16px; fill: var(--pink); flex: none; }

/* По часам */
.timeline { display: flex; flex-direction: column; }
.slot {
  display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: start;
  width: 100%; text-align: left; background: none; border: 0; padding: 12px 0;
  border-bottom: 1px solid var(--line-soft);
}
.slot:last-child { border-bottom: 0; }
.slot-time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; padding-top: 2px; }
.slot-time small { display: block; font-weight: 400; font-size: 12px; color: var(--faint); }
.slot-body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.slot-body .item-title { font-size: 15px; font-weight: 600; }
.slot-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.tag { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.now-pill { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; background: var(--gold); color: var(--gold-ink); padding: 2px 7px; border-radius: 999px; }
.slot.is-now .slot-time { color: var(--gold-2); }
.slot .mark { margin-top: 1px; }
.timeline-card { background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 4px 16px; }

/* Дела */
.tasks { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 4px 16px; }
.task { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; padding: 13px 0; border-bottom: 1px solid var(--line-soft); }
.task:last-child { border-bottom: 0; }
.task .task-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

/* Из головы */
.inbox { display: flex; flex-direction: column; gap: 10px; }
.note { border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: rgba(214,182,112,.04); }
.note.is-new { animation: glow 1.6s ease; }
@keyframes glow { 0% { background: rgba(214,182,112,.22); } 100% { background: rgba(214,182,112,.04); } }
.note-text { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.note-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.note-time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.btn-sort { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--gold-2); }
.empty { font-size: 14px; color: var(--faint); padding: 14px 16px; border: 1px dashed var(--line-soft); border-radius: var(--r); margin: 0; }

/* Вечерний итог */
.eve {
  border-radius: 22px; padding: 20px 18px; display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(160deg, #1A2B3A 0%, #12221C 75%);
  border: 1px solid rgba(160,180,220,.18);
}
.eve.is-evening { border-color: var(--line); box-shadow: 0 0 0 4px rgba(214,182,112,.06); }
.eve h2 { margin: 0; font-size: 20px; font-weight: 800; }
.eve p { margin: 0; font-size: 14px; color: var(--muted); }
.eve .moon { width: 22px; height: 22px; fill: var(--gold-2); }
.eve-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.eve-answers { display: flex; flex-direction: column; gap: 10px; }
.eve-answers div { display: flex; flex-direction: column; gap: 2px; }
.eve-answers span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.eve-answers q { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--text); quotes: "«" "»"; overflow-wrap: anywhere; }

/* Карта дня на главном экране */
.day-card {
  display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left;
  background: linear-gradient(135deg, rgba(214,182,112,.12), rgba(46,139,106,.10));
  border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px;
}
.dc-label { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.dc-label svg { width: 12px; height: 12px; fill: var(--gold); flex: none; }
.dc-phrase { font-family: var(--serif); font-style: italic; font-size: 17px; line-height: 1.35; color: var(--text); text-wrap: pretty; }
.dc-more { font-size: 12.5px; color: var(--muted); }

.foot { display: flex; flex-direction: column; gap: 2px; align-items: center; padding-top: 4px; }
.foot p { margin: 0 0 4px; font-size: 12px; color: var(--faint); text-align: center; }
.link-btn { background: none; border: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

/* Главная кнопка */
.fab-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; justify-content: center; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 45%, rgba(10,20,17,0));
}
.fab {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink);
  border: 0; border-radius: 999px; padding: 15px 26px 15px 20px; font-weight: 800; font-size: 16px;
  box-shadow: 0 10px 30px rgba(214,182,112,.28), 0 2px 0 rgba(255,255,255,.35) inset;
  width: 100%; max-width: 448px; justify-content: center;
}
.fab .plus { width: 26px; height: 26px; border-radius: 50%; background: var(--gold-ink); color: var(--gold-2); display: grid; place-items: center; font-size: 20px; line-height: 1; font-weight: 400; }
.fab:active { transform: scale(.98); }

/* Нижняя шторка */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 40; opacity: 0; transition: opacity .2s; }
.overlay.open { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 480px; margin: 0 auto;
  background: var(--card-2); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 24px 24px 0 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.9,.3,1);
  display: flex; flex-direction: column; gap: 14px; max-height: 90%; overflow-y: auto;
}
.sheet.open { transform: translateY(0); }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px; flex: none; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; text-wrap: balance; }
.sheet .sub { margin: -8px 0 0; font-size: 13.5px; color: var(--muted); }
.quote { margin: 0; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--gold-2); overflow-wrap: anywhere; }
textarea, input[type="time"] {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 16px;
}
textarea { min-height: 110px; resize: none; }
textarea.short { min-height: 76px; }
textarea::placeholder { color: var(--faint); }
.btn-main {
  width: 100%; border: 0; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 16px;
  background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: var(--gold-ink);
}
.btn-main:disabled { opacity: .4; cursor: default; }
.btn-ghost { width: 100%; border: 1px solid var(--line-soft); background: none; border-radius: 14px; padding: 13px; font-weight: 600; color: var(--muted); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px; padding: 14px;
}
.choice .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--emerald-soft); flex: none; }
.choice .ico svg { width: 18px; height: 18px; stroke: var(--gold-2); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.choice b { display: block; font-size: 15px; }
.choice span { display: block; font-size: 12.5px; color: var(--muted); }
.choice.is-active { border-color: var(--gold); }
.choice.danger b { color: var(--pink); }
.field-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.q { display: flex; flex-direction: column; gap: 8px; }
.checks { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px; padding: 2px 14px; }
.check { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; accent-color: var(--gold); flex: none; margin: 0; }
.check span { font-size: 14.5px; min-width: 0; overflow-wrap: anywhere; }
.check small { display: block; font-size: 11.5px; color: var(--faint); }

/* Неделя в шторке */
.wk-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wk-big b { font-size: 40px; line-height: 1; font-weight: 800; color: var(--gold-2); font-variant-numeric: tabular-nums; }
.wk-big span { font-size: 14px; color: var(--muted); }
.wk-days { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line-soft); border-radius: 14px; padding: 2px 14px; }
.wk-day { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; font-variant-numeric: tabular-nums; }
.wk-day:last-child { border-bottom: 0; }
.wk-day.today b { color: var(--gold-2); }
.wk-day .st { font-size: 12px; color: var(--faint); }
.wk-day .st.on { color: var(--gold); font-weight: 700; }
.wk-day .hc { display: inline-flex; align-items: center; gap: 4px; min-width: 38px; justify-content: flex-end; }
.wk-day .hc svg { width: 11px; height: 11px; fill: var(--pink); }
.wk-note { margin: 0; font-size: 12px; color: var(--faint); }

/* Уведомление */
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 90;
  transform: translate(-50%, -16px); opacity: 0; transition: opacity .2s, transform .25s;
  width: max-content; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  background: var(--text); color: var(--bg); font-weight: 700; font-size: 14px;
  padding: 10px 16px; border-radius: 999px; max-width: calc(100% - 32px); text-align: center;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Заглушка */
.state-card { margin-top: 12vh; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
.state-card h2 { margin: 0; font-size: 22px; font-weight: 800; }
.state-card p { margin: 0; color: var(--muted); font-size: 14.5px; }
.state-card .eyebrow { margin-bottom: -4px; }
.loading { margin-top: 30vh; text-align: center; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 18px; }

/* Полноэкранная сцена: карта дня и финал */
.stage {
  position: fixed; inset: 0; z-index: 70; overflow-y: auto; overflow-x: hidden;
  background: var(--bg);
  background-image:
    radial-gradient(70% 45% at 50% 38%, rgba(214,182,112,.16), transparent 70%),
    radial-gradient(120% 60% at 100% 0%, var(--bg-glow), transparent 60%);
  display: flex; align-items: center; justify-content: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  opacity: 0; transition: opacity .35s ease;
}
.stage.open { opacity: 1; }
.stage.gold {
  background-image:
    radial-gradient(80% 55% at 50% 40%, rgba(240,215,154,.38), transparent 72%),
    radial-gradient(120% 60% at 0% 100%, rgba(242,139,174,.14), transparent 60%);
}
.stage-inner { position: relative; z-index: 1; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.stage-date { margin: -10px 0 0; font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--gold-2); }
.stage-hint { margin: 0; font-size: 13.5px; color: var(--muted); min-height: 1.4em; }
.stage .btn-main { max-width: 300px; }
.stage-skip { background: none; border: 0; color: var(--faint); font-size: 13px; padding: 4px 8px; }

.card3d { width: min(70vw, 270px, 38vh); aspect-ratio: 2 / 3; max-width: 100%; perspective: 1400px; animation: float 4.5s ease-in-out infinite; }
.card3d.flipped { animation: none; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.2,.8,.2,1); }
.card3d.flipped .card-inner { transform: rotateY(180deg); }
.card3d.instant .card-inner { transition: none; }
.face {
  position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border: 1px solid var(--gold);
  box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 0 0 7px var(--card), inset 0 0 0 8px rgba(214,182,112,.55);
}
.back { background: linear-gradient(160deg, #17382D, #0D1F19 70%); display: grid; place-items: center; cursor: pointer; }
.back svg { width: 82%; height: auto; }
.back::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 35%, rgba(240,215,154,.22) 50%, transparent 65%);
  transform: translateX(-120%); animation: shine 3.6s ease-in-out infinite 1s;
}
@keyframes shine { 0% { transform: translateX(-120%); } 45%, 100% { transform: translateX(120%); } }
.front {
  transform: rotateY(180deg);
  background: linear-gradient(170deg, #1E3A30, #13261F 75%);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 22px 18px 20px; text-align: center;
}
.front-top { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.roman { font-family: var(--serif); font-size: 15px; color: var(--gold); letter-spacing: .12em; }
.front-name { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; font-weight: 800; color: var(--gold-2); }
.front-orn { width: 34px; height: 34px; }
.front-phrase { margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(15px, 4.6vw, 19px); line-height: 1.35; color: var(--text); text-wrap: balance; }
.front-hint { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; width: 100%; }
.front-hint span { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.front-hint p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }

/* Финал дня */
.finale-title { margin: -6px 0 0; font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 54px; line-height: 1; color: var(--gold-2); }
.finale-sub { margin: 0; font-size: 15px; color: var(--text); max-width: 30ch; }
.finale-seal { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, var(--gold-2), var(--gold)); box-shadow: 0 0 0 8px rgba(214,182,112,.15), 0 0 60px rgba(240,215,154,.45); animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
.finale-seal svg { width: 42px; height: 42px; fill: #D9567F; }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.finale-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.finale-stats div { background: rgba(10,20,17,.55); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.finale-stats b { font-size: 24px; font-weight: 800; color: var(--gold-2); font-variant-numeric: tabular-nums; }
.finale-stats span { font-size: 12px; color: var(--muted); }
.floaty { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.floaty svg { position: absolute; bottom: -30px; fill: var(--pink); opacity: 0; animation: rise linear infinite; }
@keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .floaty { display: none; }
}

<div class="wrap" id="app"><p class="loading">Собираю твой день…</p></div>

<script>
(function () {
  "use strict";

  /* ---------- Telegram ---------- */
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#0A1411"); tg.setBackgroundColor("#0A1411"); } catch (e) {}
  }
  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === "success") tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    } catch (e) {}
  }

  /* ---------- Настройки ---------- */
  var STORE_KEY = "moy-den-v1";
  var HIST_KEY = "moy-den-history-v1";
  var CARD_KEY = "moy-den-card-v1";
  var TOMORROW_KEY = "moy-den-tomorrow-v1";
  var MAX_FOCUS = 3;

  var DEFAULT_DAY_TYPES = [
    { id: "soyuznaya", label: "Салон на Союзной" },
    { id: "merci", label: "Салон «Мерси»" },
    { id: "online", label: "Онлайн-день" },
    { id: "off", label: "Выходной" }
  ];
  var DEFAULT_CATEGORIES = { client: "Клиентка", student: "Обучение", content: "Контент", family: "Семья", sport: "Спорт", personal: "Личное" };
  var DEFAULT_CARDS = [
    { id: "d1", name: "Тишина", phrase: "Сегодня не нужно успевать всё. Достаточно успеть главное.", hint: "Начни с первого дела из «Главного», пока голова свежая." },
    { id: "d2", name: "Первый шаг", phrase: "Самое трудное дело становится легче уже через две минуты после начала.", hint: "Открой самое неприятное дело и сделай в нём только первый шаг." },
    { id: "d3", name: "Пауза", phrase: "Отдых это часть плана, а не награда за идеальный день.", hint: "Поставь в расписание 20 минут только для себя." }
  ];

  var CARDS = DEFAULT_CARDS;
  var EXAMPLE_HISTORY = {};
  var base = null;
  var S = null;
  var newNoteId = null;
  var cardSkipped = false;

  var app = document.getElementById("app");
  var fabBar = document.getElementById("fabBar");
  var overlay = document.getElementById("overlay");
  var sheet = document.getElementById("sheet");
  var stage = document.getElementById("stage");
  var toastEl = document.getElementById("toast");

  /* ---------- Значки ---------- */
  var HEART_PATH = "M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.4.7 1.6.7 2 0 .7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z";
  var ICONS = {
    heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + HEART_PATH + '"/></svg>',
    chevron: '<svg viewBox="0 0 12 12" fill="none" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>',
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17.5" r="1"/></svg>',
    trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></svg>',
    sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>',
    mountain: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19.5l6.5-11 4 6.5 2.5-4 5 8.5z"/></svg>',
    minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l2.2 7.3 7.3 2.2-7.3 2.2L12 20.5l-2.2-7.3-7.3-2.2 7.3-2.2z"/></svg>',
    moon: '<svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 16.2l-4-4 1.4-1.4 2.6 2.6 7.1-7.1 1.4 1.4z"/></svg>'
  };
  var CARD_BACK =
    '<svg viewBox="0 0 100 150" aria-hidden="true" fill="none" stroke="#D6B670" stroke-width=".8">' +
      '<circle cx="50" cy="75" r="34" opacity=".55"/><circle cx="50" cy="75" r="27"/>' +
      '<rect x="33" y="58" width="34" height="34"/><rect x="33" y="58" width="34" height="34" transform="rotate(45 50 75)"/>' +
      '<circle cx="50" cy="75" r="11" opacity=".7"/>' +
      '<path d="M50 30v-12M50 120v12M15 75H6M85 75h9" opacity=".6"/>' +
      '<path d="M50 14l1.6 3.4 3.4 1.6-3.4 1.6L50 24l-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#F0D79A" stroke="none"/>' +
      '<path d="M50 126l1.6 3.4 3.4 1.6-3.4 1.6L50 136l-1.6-3.4-3.4-1.6 3.4-1.6z" fill="#F0D79A" stroke="none"/>' +
      '<circle cx="14" cy="16" r="1.3" fill="#D6B670" stroke="none"/><circle cx="86" cy="16" r="1.3" fill="#D6B670" stroke="none"/>' +
      '<circle cx="14" cy="134" r="1.3" fill="#D6B670" stroke="none"/><circle cx="86" cy="134" r="1.3" fill="#D6B670" stroke="none"/>' +
      '<path transform="translate(44.6 69.8) scale(.45)" fill="#F28BAE" stroke="none" d="' + HEART_PATH + '"/>' +
    '</svg>';
  var CARD_ORN =
    '<svg class="front-orn" viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="#D6B670" stroke-width="1">' +
      '<circle cx="20" cy="20" r="15" opacity=".6"/>' +
      '<path d="M20 6l2.8 11.2L34 20l-11.2 2.8L20 34l-2.8-11.2L6 20l11.2-2.8z" fill="rgba(240,215,154,.18)"/>' +
    '</svg>';

  /* ---------- Утилиты ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function nowHM() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function dateOf(key) { var p = key.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(key, n) { var d = dateOf(key); d.setDate(d.getDate() + n); return keyOf(d); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function nextHour() { var d = new Date(); return pad(Math.min(d.getHours() + 1, 23)) + ":00"; }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function roman(n) {
    var r = "", m = [[10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
    for (var i = 0; i < m.length; i++) while (n >= m[i][0]) { r += m[i][1]; n -= m[i][0]; }
    return r;
  }
  var WD_SHORT = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];

  /* Хранилище: localStorage с запасным вариантом в памяти */
  var mem = {};
  function lsGet(k) {
    try { var raw = localStorage.getItem(k); if (raw) return JSON.parse(raw); } catch (e) {}
    return mem[k] ? clone(mem[k]) : null;
  }
  function lsSet(k, v) { mem[k] = clone(v); try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function lsDel(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }

  /* ---------- Состояние дня ---------- */
  function normalize(data) {
    var t = (data && data.today) || {};
    return {
      dayTypes: Array.isArray(data && data.dayTypes) && data.dayTypes.length ? data.dayTypes : clone(DEFAULT_DAY_TYPES),
      categories: (data && data.categories) || clone(DEFAULT_CATEGORIES),
      dayType: t.dayType || null,
      focus: Array.isArray(t.focus) ? t.focus : [],
      schedule: Array.isArray(t.schedule) ? t.schedule : [],
      tasks: Array.isArray(t.tasks) ? t.tasks : [],
      inbox: Array.isArray(t.inbox) ? t.inbox : [],
      review: null,
      finaleShown: false
    };
  }
  function freshDay() {
    var s = normalize(clone(base || {}));
    if (!s.dayType && s.dayTypes[0]) s.dayType = s.dayTypes[0].id;
    applyCarryover(s);
    return s;
  }
  /* Дела, перенесённые вчерашним итогом */
  function applyCarryover(s) {
    var t = lsGet(TOMORROW_KEY);
    if (!t || t.date > todayKey()) return;
    (t.items || []).forEach(function (it) {
      var openFocus = s.focus.filter(function (f) { return !f.done; }).length;
      if (it.list === "focus" && openFocus < MAX_FOCUS) {
        s.focus.push({ id: uid("f"), title: it.title, done: false, carried: true });
      } else {
        s.tasks.push({ id: uid("t"), title: it.title + (it.time ? " (было на " + it.time + ")" : ""), done: false, carried: true });
      }
    });
    lsDel(TOMORROW_KEY);
  }
  function save() { lsSet(STORE_KEY, { date: todayKey(), state: S }); recordHistory(); }
  function loadSaved() { var o = lsGet(STORE_KEY); return o && o.date === todayKey() && o.state ? o.state : null; }

  /* ---------- Сердечки и история ---------- */
  function allItems() { return S.focus.concat(S.schedule, S.tasks); }
  function heartsToday() {
    var n = 0;
    allItems().forEach(function (x) { if (x.done) n += 1; });
    S.focus.forEach(function (f) { if (f.done && f.hard) n += 1; });
    return n;
  }
  function focusClosed() { return S.focus.length > 0 && S.focus.every(function (f) { return f.done; }); }
  function recordHistory() {
    var h = lsGet(HIST_KEY) || {};
    h[todayKey()] = { focus: focusClosed(), hearts: heartsToday(), review: !!S.review };
    lsSet(HIST_KEY, h);
  }
  function history() {
    var h = {}, k;
    for (k in EXAMPLE_HISTORY) if (k.charAt(0) !== "_") h[k] = EXAMPLE_HISTORY[k];
    var local = lsGet(HIST_KEY) || {};
    for (k in local) h[k] = local[k];
    h[todayKey()] = { focus: focusClosed(), hearts: heartsToday(), review: !!S.review };
    return h;
  }
  function weekStats() {
    var h = history(), t = todayKey(), days = [], closed = 0, hearts = 0, prev = 0, i, k;
    var __mon = addDays(t, -((new Date().getDay() + 6) % 7));
    for (i = 0; i < 7; i++) {
      k = addDays(__mon, i);
      var rec = h[k] || null;
      var d = { key: k, focus: !!(rec && rec.focus), hearts: rec ? (rec.hearts || 0) : 0, known: !!rec, isToday: k === t };
      if (d.focus) closed++;
      hearts += d.hearts;
      days.push(d);
    }
    for (i = 1; i <= 7; i++) { k = addDays(__mon, -i); if (h[k]) prev += h[k].hearts || 0; }
    return { days: days, closed: closed, hearts: hearts, prev: prev };
  }

  /* ---------- Карта дня ---------- */
  function findCard(id) {
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return { card: CARDS[i], n: i + 1 };
    return null;
  }
  function todayCard() {
    var o = lsGet(CARD_KEY);
    return o && o.date === todayKey() ? findCard(o.id) : null;
  }
  function drawCard() {
    var o = lsGet(CARD_KEY) || {};
    var pool = CARDS.filter(function (c) { return c.id !== o.id; });
    if (!pool.length) pool = CARDS;
    var c = pool[Math.floor(Math.random() * pool.length)];
    lsSet(CARD_KEY, { date: todayKey(), id: c.id });
    return findCard(c.id);
  }
  function cardFrontHTML(tc) {
    return '<div class="front-top"><span class="roman">' + roman(tc.n) + '</span><span class="front-name">' + esc(tc.card.name) + '</span></div>' +
      CARD_ORN +
      '<p class="front-phrase">' + esc(tc.card.phrase) + '</p>' +
      '<div class="front-hint"><span>Совет дня</span><p>' + esc(tc.card.hint) + '</p></div>';
  }

  /* ---------- Загрузка ---------- */
  function load() {
    app.innerHTML = '<p class="loading">Собираю твой день…</p>';
    fabBar.hidden = true;
    function getJSON(url) {
      return fetch(url, { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
    }
    /* Сначала с антикеш-параметром, если хостинг его не принимает, вторая попытка без него */
    getJSON("data.json?v=" + Date.now())
      .catch(function () { return getJSON("data.json"); })
      .then(function (data) {
        base = data;
        if (Array.isArray(data.cards) && data.cards.length) CARDS = data.cards;
        EXAMPLE_HISTORY = data.historyExample || {};
        S = loadSaved() || freshDay();
        save();
        render();
        maybeShowCard();
      })
      .catch(function () {
        var saved = loadSaved();
        if (saved) { S = saved; render(); maybeShowCard(); toast("Нет связи с файлом, показываю сохранённый день"); return; }
        renderError();
      });
  }

  function renderError() {
    fabBar.hidden = true;
    app.innerHTML =
      '<div class="state-card">' +
        '<div class="eyebrow">Мой день</div>' +
        '<h2>План дня не загрузился</h2>' +
        '<p>Не получилось открыть файл data.json. Проверь, что он лежит рядом с index.html, и попробуй ещё раз.</p>' +
        '<button class="btn-main" type="button" data-action="retry">Попробовать снова</button>' +
        '<button class="btn-ghost" type="button" data-action="blank">Начать с чистого листа</button>' +
      '</div>';
  }

  /* ---------- Отрисовка ---------- */
  function counts() {
    var all = allItems();
    return { done: all.filter(function (x) { return x.done; }).length, total: all.length };
  }
  function dayLabel() {
    var f = S.dayTypes.filter(function (d) { return d.id === S.dayType; })[0];
    return f ? f.label : "Тип дня";
  }
  function markHTML(double) {
    return '<span class="mark' + (double ? " double" : "") + '" aria-hidden="true">' + ICONS.heart + (double ? ICONS.heart : "") + '</span>';
  }
  function carriedBadge(x) { return x.carried ? '<span class="badge carried">Со вчера</span>' : ""; }

  function render() {
    var d = new Date();
    var wd = d.toLocaleDateString("ru-RU", { weekday: "long" });
    var dm = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    var c = counts();
    var pct = c.total ? Math.round(c.done / c.total * 100) : 0;
    var now = nowHM();
    var wk = weekStats();
    var tc = todayCard();
    var html = "";

    /* 1. Дата, тип дня, прогресс и неделя */
    html +=
      '<header class="top">' +
        '<div class="eyebrow">Мой день</div>' +
        '<h1 class="date"><span class="wd">' + esc(wd) + '</span><span class="dm">' + esc(dm) + '</span></h1>' +
        '<div class="top-row"><button class="daytype" type="button" data-action="daytype" aria-label="Сменить тип дня">' + esc(dayLabel()) + ICONS.chevron + '</button></div>' +
        '<div class="progress">' +
          '<div class="progress-text">Сделано <b>' + c.done + '</b> из <b>' + c.total + '</b></div>' +
          '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
        '</div>' +
        '<button class="week" type="button" data-action="week" aria-label="Открыть мою неделю">' +
          '<span class="week-dots">' + wk.days.map(function (x) {
            return '<span class="wdot' + (x.focus ? " on" : "") + (x.isToday ? " today" : "") + '"><i>' + ICONS.check + '</i><small>' + WD_SHORT[dateOf(x.key).getDay()] + '</small></span>';
          }).join("") + '</span>' +
          '<span class="week-text"><span>Главное закрыто <b>' + wk.closed + ' из 7</b> дней</span>' +
          '<span class="h">' + ICONS.heart + '<b>' + wk.hearts + '</b> за 7 дней</span></span>' +
        '</button>' +
      '</header>';

    /* Карта дня */
    if (tc) {
      html += '<button type="button" class="day-card" data-action="card-open"><span class="dc-label">' + ICONS.sparkle + 'Карта дня · ' + esc(tc.card.name) + '</span>' +
        '<span class="dc-phrase">' + esc(tc.card.phrase) + '</span><span class="dc-more">Нажми, чтобы открыть карту и совет дня</span></button>';
    } else {
      html += '<button type="button" class="day-card" data-action="card-open"><span class="dc-label">' + ICONS.sparkle + 'Карта дня</span>' +
        '<span class="dc-phrase">Твоя карта на сегодня ещё лежит рубашкой вверх.</span><span class="dc-more">Нажми, чтобы вытянуть</span></button>';
    }

    /* 2. Главное по работе */
    var focusDoneN = S.focus.filter(function (f) { return f.done; }).length;
    var hasHard = S.focus.some(function (f) { return f.hard; });
    html += '<section class="sec" aria-labelledby="h-focus"><div class="sec-head"><h2 class="sec-title" id="h-focus">Главное по работе</h2>' +
      '<span class="sec-count">' + focusDoneN + ' / ' + S.focus.length + '</span></div>';
    if (!S.focus.length) {
      html += '<p class="empty">Пока ничего. Перенеси сюда мысль из блока «Из головы», максимум ' + MAX_FOCUS + ' дела.</p>';
    } else {
      var ordered = S.focus.slice().sort(function (a, b) { return (b.hard ? 1 : 0) - (a.hard ? 1 : 0); });
      html += '<div class="focus-list">' + ordered.map(function (f) {
        return '<button type="button" class="focus' + (f.done ? " is-done" : "") + (f.hard ? " is-hard" : "") + '" data-action="toggle" data-list="focus" data-id="' + esc(f.id) + '" aria-pressed="' + !!f.done + '">' +
          markHTML(f.hard) +
          '<span class="focus-body">' + (f.hard ? '<span class="badge hard">Самое трудное · двойное сердце</span>' : '') + carriedBadge(f) +
          '<span class="item-title">' + esc(f.title) + '</span></span></button>';
      }).join("") + '</div>';
      if (focusClosed()) html += '<div class="all-done">' + ICONS.heart + 'Главное на сегодня сделано. Можно выдохнуть.</div>';
      else html += '<button type="button" class="link-inline" data-action="pick-hard">' + (hasHard ? 'Сменить самое трудное' : 'Отметить самое трудное дело') + '</button>';
    }
    html += '</section>';

    /* 3. День по часам */
    var sched = S.schedule.slice().sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); });
    html += '<section class="sec" aria-labelledby="h-sched"><div class="sec-head"><h2 class="sec-title" id="h-sched">День по часам</h2>' +
      '<span class="sec-count">' + sched.length + ' ' + plural(sched.length, "событие", "события", "событий") + '</span></div>';
    if (!sched.length) {
      html += '<p class="empty">Расписание пустое. Время можно назначить мысли из блока «Из головы».</p>';
    } else {
      html += '<div class="timeline-card"><div class="timeline">' + sched.map(function (s) {
        var isNow = s.time && s.end && s.time <= now && now < s.end;
        var cat = S.categories[s.category] || "";
        return '<button type="button" class="slot' + (s.done ? " is-done" : "") + (isNow ? " is-now" : "") + '" data-action="toggle" data-list="schedule" data-id="' + esc(s.id) + '" aria-pressed="' + !!s.done + '">' +
          '<span class="slot-time">' + esc(s.time || "") + (s.end ? '<small>до ' + esc(s.end) + '</small>' : '') + '</span>' +
          '<span class="slot-body"><span class="item-title">' + esc(s.title) + '</span>' +
            '<span class="slot-meta">' + (isNow ? '<span class="now-pill">Сейчас</span>' : '') +
              (cat ? '<span class="tag">' + esc(cat) + '</span>' : '') + (s.note ? '<span>' + esc(s.note) + '</span>' : '') +
            '</span></span>' + markHTML(false) + '</button>';
      }).join("") + '</div></div>';
    }
    html += '</section>';

    /* 4. Дела на сегодня */
    html += '<section class="sec" aria-labelledby="h-tasks"><div class="sec-head"><h2 class="sec-title" id="h-tasks">Дела на сегодня</h2>' +
      '<span class="sec-count">' + S.tasks.filter(function (t) { return t.done; }).length + ' / ' + S.tasks.length + '</span></div>' +
      '<p class="sec-hint">Без времени, в любой свободный момент</p>';
    if (!S.tasks.length) {
      html += '<p class="empty">Список пуст. Перенеси сюда мысль из блока «Из головы».</p>';
    } else {
      html += '<div class="tasks">' + S.tasks.map(function (t) {
        return '<button type="button" class="task' + (t.done ? " is-done" : "") + '" data-action="toggle" data-list="tasks" data-id="' + esc(t.id) + '" aria-pressed="' + !!t.done + '">' +
          markHTML(false) + '<span class="task-body">' + carriedBadge(t) + '<span class="item-title">' + esc(t.title) + '</span></span></button>';
      }).join("") + '</div>';
    }
    html += '</section>';

    /* 5. Из головы */
    html += '<section class="sec" id="inboxSec" aria-labelledby="h-inbox"><div class="sec-head"><h2 class="sec-title" id="h-inbox">Из головы</h2>' +
      '<span class="sec-count">' + S.inbox.length + ' ' + plural(S.inbox.length, "мысль", "мысли", "мыслей") + '</span></div>';
    if (!S.inbox.length) {
      html += '<p class="empty">Голова свободна. Появилась мысль? Жми «Скинуть мысль» внизу.</p>';
    } else {
      html += '<div class="inbox">' + S.inbox.slice().reverse().map(function (n) {
        return '<div class="note' + (n.id === newNoteId ? " is-new" : "") + '"><p class="note-text">' + esc(n.text) + '</p>' +
          '<div class="note-foot"><span class="note-time">' + esc(n.createdAt || "") + '</span>' +
          '<button type="button" class="btn-sort" data-action="sort" data-id="' + esc(n.id) + '">Разобрать →</button></div></div>';
      }).join("") + '</div>';
    }
    html += '</section>';

    /* Вечерний итог */
    var evening = now >= "18:00";
    if (!S.review) {
      html += '<section class="eve' + (evening ? " is-evening" : "") + '" aria-labelledby="h-eve">' +
        '<div class="eve-head"><span class="eyebrow">' + (evening ? "Вечер" : "В конце дня") + '</span>' + ICONS.moon + '</div>' +
        '<h2 id="h-eve">Итог дня</h2>' +
        '<p>Три коротких вопроса, и несделанное переедет на завтра. Голова ляжет спать пустой.</p>' +
        '<button class="btn-main" type="button" data-action="review">Подвести итог</button></section>';
    } else {
      var r = S.review;
      html += '<section class="eve" aria-labelledby="h-eve">' +
        '<div class="eve-head"><span class="eyebrow">Итог подведён · ' + esc(r.at) + '</span>' + ICONS.moon + '</div>' +
        '<h2 id="h-eve">День закрыт</h2><div class="eve-answers">' +
          (r.good ? '<div><span>Получилось</span><q>' + esc(r.good) + '</q></div>' : '') +
          (r.praise ? '<div><span>Хвалю себя за</span><q>' + esc(r.praise) + '</q></div>' : '') +
          '<div><span>На завтра</span><p>' + (r.moved ? 'Перенесено ' + r.moved + ' ' + plural(r.moved, "дело", "дела", "дел") : 'Ничего не переносила') + '</p></div>' +
        '</div><button class="btn-ghost" type="button" data-action="review">Изменить ответы</button></section>';
    }

    html += '<footer class="foot"><p>Отметки сохраняются на этом устройстве</p>' +
      '<button type="button" class="link-btn" data-action="reset">Вернуть план из файла</button>' +
      '<button type="button" class="link-btn" data-action="card-reset">Перетянуть карту дня (для проверки)</button></footer>';

    app.innerHTML = html;
    fabBar.hidden = false;
    newNoteId = null;
  }

  /* ---------- Шторка ---------- */
  var sheetOpen = false;
  function openSheet(html) {
    sheet.innerHTML = '<div class="grab"></div>' + html;
    sheet.scrollTop = 0;
    overlay.hidden = false; sheet.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add("open"); sheet.classList.add("open"); });
    sheetOpen = true;
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
  }
  function closeSheet() {
    if (!sheetOpen) return;
    overlay.classList.remove("open"); sheet.classList.remove("open");
    sheetOpen = false;
    if (tg && tg.BackButton && !stageOpen) { try { tg.BackButton.hide(); } catch (e) {} }
    setTimeout(function () { if (!sheetOpen) { overlay.hidden = true; sheet.hidden = true; sheet.innerHTML = ""; } }, 280);
  }

  /* ---------- Сцена ---------- */
  var stageOpen = false;
  function openStage(html, cls) {
    stage.className = "stage" + (cls ? " " + cls : "");
    stage.innerHTML = html;
    stage.hidden = false;
    stageOpen = true;
    fabBar.hidden = true;
    requestAnimationFrame(function () { stage.classList.add("open"); });
  }
  function closeStage() {
    if (!stageOpen) return;
    stage.classList.remove("open");
    stageOpen = false;
    fabBar.hidden = !S;
    setTimeout(function () { if (!stageOpen) { stage.hidden = true; stage.innerHTML = ""; } }, 360);
  }
  function backPressed() { if (sheetOpen) closeSheet(); else if (stageOpen) closeStage(); }
  if (tg && tg.BackButton) { try { tg.BackButton.onClick(backPressed); } catch (e) {} }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2400);
  }

  /* ---------- Карта дня: сцена ---------- */
  function maybeShowCard() { if (!todayCard() && !cardSkipped) openCardStage(); }
  function openCardStage() {
    var tc = todayCard();
    var dm = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    openStage(
      '<div class="stage-inner">' +
        '<div class="eyebrow">Карта дня</div>' +
        '<p class="stage-date">' + esc(dm) + '</p>' +
        '<div class="card3d' + (tc ? " flipped instant" : "") + '" id="card3d"><div class="card-inner">' +
          '<div class="face back" data-action="card-draw" role="button" tabindex="0" aria-label="Перевернуть карту">' + CARD_BACK + '</div>' +
          '<div class="face front" id="cardFront">' + (tc ? cardFrontHTML(tc) : '') + '</div>' +
        '</div></div>' +
        '<p class="stage-hint" id="stageHint">' + (tc ? 'Эта карта с тобой до конца дня' : 'Сделай вдох и нажми на карту') + '</p>' +
        (tc ? '<button class="btn-main" type="button" data-action="stage-close">Вернуться к дню</button>'
            : '<button class="btn-main" type="button" id="stageBtn" data-action="card-draw">Перевернуть карту</button>' +
              '<button class="stage-skip" type="button" data-action="card-skip">Позже</button>') +
      '</div>'
    );
  }
  function flipCard() {
    var box = document.getElementById("card3d");
    if (!box || box.classList.contains("flipped")) return;
    var tc = todayCard() || drawCard();
    document.getElementById("cardFront").innerHTML = cardFrontHTML(tc);
    box.classList.add("flipped");
    haptic("success");
    var hint = document.getElementById("stageHint");
    if (hint) hint.textContent = "Эта карта с тобой до конца дня";
    var btn = document.getElementById("stageBtn");
    if (btn) { btn.textContent = "Начать день"; btn.setAttribute("data-action", "stage-close"); }
    var skip = stage.querySelector(".stage-skip");
    if (skip) skip.hidden = true;
    render();
  }

  /* ---------- Финал дня ---------- */
  function showFinale() {
    var wk = weekStats();
    var hearts = "";
    for (var i = 0; i < 14; i++) {
      var size = 12 + Math.round(Math.random() * 16);
      hearts += '<svg viewBox="0 0 24 24" style="left:' + Math.round(Math.random() * 96) + '%;width:' + size + 'px;height:' + size + 'px;animation-duration:' + (5 + Math.random() * 5).toFixed(1) + 's;animation-delay:' + (Math.random() * 4).toFixed(1) + 's"><path d="' + HEART_PATH + '"/></svg>';
    }
    openStage(
      '<div class="floaty" aria-hidden="true">' + hearts + '</div>' +
      '<div class="stage-inner">' +
        '<div class="finale-seal">' + ICONS.heart + '</div>' +
        '<div class="eyebrow">Главное на сегодня</div>' +
        '<h2 class="finale-title">Сделано</h2>' +
        '<p class="finale-sub">Все главные дела закрыты. Всё остальное сегодня уже сверх плана.</p>' +
        '<div class="finale-stats">' +
          '<div><b>' + heartsToday() + '</b><span>' + plural(heartsToday(), "сердечко", "сердечка", "сердечек") + ' сегодня</span></div>' +
          '<div><b>' + wk.closed + ' из 7</b><span>дней с закрытым главным</span></div>' +
        '</div>' +
        '<button class="btn-main" type="button" data-action="stage-close">Продолжить день</button>' +
      '</div>', "gold"
    );
  }

  /* ---------- Скинуть мысль ---------- */
  function openCapture() {
    openSheet(
      '<h2 id="sheetTitle">Скинуть мысль</h2>' +
      '<p class="sub">Запиши как есть. Разберёшь потом.</p>' +
      '<textarea id="captureText" maxlength="300" placeholder="Например: купить новые пинцеты"></textarea>' +
      '<button class="btn-main" type="button" id="captureSave" data-action="capture-save" disabled>Сохранить</button>'
    );
    var ta = document.getElementById("captureText");
    var btn = document.getElementById("captureSave");
    ta.addEventListener("input", function () { btn.disabled = !ta.value.trim(); });
    ta.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && ta.value.trim()) { e.preventDefault(); saveCapture(); }
    });
    setTimeout(function () { try { ta.focus(); } catch (e) {} }, 300);
  }
  function saveCapture() {
    var ta = document.getElementById("captureText");
    var text = ta ? ta.value.trim() : "";
    if (!text) return;
    var note = { id: uid("n"), text: text, createdAt: nowHM() };
    S.inbox.push(note);
    newNoteId = note.id;
    save(); closeSheet(); render(); haptic("success");
    toast("Записано в «Из головы»");
    var sec = document.getElementById("inboxSec");
    if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ---------- Разобрать мысль ---------- */
  function findNote(id) { return S.inbox.filter(function (n) { return n.id === id; })[0]; }
  function choice(action, id, icon, title, sub, extra) {
    return '<button type="button" class="choice ' + (extra || "") + '" data-action="' + action + '" data-id="' + esc(id) + '">' +
      '<span class="ico">' + icon + '</span><span><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></span></button>';
  }
  function openSort(id) {
    var n = findNote(id);
    if (!n) return;
    var focusFull = S.focus.filter(function (f) { return !f.done; }).length >= MAX_FOCUS;
    openSheet(
      '<h2 id="sheetTitle">Куда это?</h2>' +
      '<p class="quote">«' + esc(n.text) + '»</p>' +
      '<div class="choices">' +
        choice("to-focus", id, ICONS.star, "В главное по работе", focusFull ? "Сейчас там уже " + MAX_FOCUS + " дела" : "Обязательно сделать сегодня") +
        choice("to-time", id, ICONS.clock, "В день по часам", "Назначить время") +
        choice("to-tasks", id, ICONS.list, "В дела на сегодня", "Без привязки ко времени") +
        choice("delete", id, ICONS.trash, "Удалить", "Мысль больше не нужна", "danger") +
      '</div>' +
      '<button class="btn-ghost" type="button" data-action="close">Оставить пока здесь</button>'
    );
  }
  function removeNote(id) { S.inbox = S.inbox.filter(function (n) { return n.id !== id; }); }
  function moveToList(id, list) {
    var n = findNote(id);
    if (!n) return;
    if (list === "focus" && S.focus.filter(function (f) { return !f.done; }).length >= MAX_FOCUS) {
      toast("В главном уже " + MAX_FOCUS + " дела. Сначала отметь одно"); haptic(); return;
    }
    S[list].push({ id: uid(list.charAt(0)), title: n.text, done: false });
    if (list === "focus") S.finaleShown = false;
    removeNote(id); save(); closeSheet(); render(); haptic("success");
    toast(list === "focus" ? "Перенесено в «Главное»" : "Перенесено в «Дела на сегодня»");
  }
  function openTime(id) {
    var n = findNote(id);
    if (!n) return;
    var start = nextHour();
    var endH = Math.min(parseInt(start, 10) + 1, 23);
    openSheet(
      '<h2 id="sheetTitle">Во сколько?</h2>' +
      '<p class="quote">«' + esc(n.text) + '»</p>' +
      '<div class="row-2">' +
        '<label class="q"><span class="field-label">Начало</span><input type="time" id="tStart" value="' + start + '"></label>' +
        '<label class="q"><span class="field-label">Конец</span><input type="time" id="tEnd" value="' + pad(endH) + ':' + (endH === 23 ? '59' : '00') + '"></label>' +
      '</div>' +
      '<button class="btn-main" type="button" data-action="time-save" data-id="' + esc(id) + '">Поставить в расписание</button>' +
      '<button class="btn-ghost" type="button" data-action="sort" data-id="' + esc(id) + '">Назад</button>'
    );
  }
  function saveTime(id) {
    var n = findNote(id);
    var st = document.getElementById("tStart").value;
    var en = document.getElementById("tEnd").value;
    if (!n || !st) { toast("Укажи время начала"); return; }
    if (en && en <= st) { toast("Конец должен быть позже начала"); return; }
    S.schedule.push({ id: uid("s"), time: st, end: en || "", title: n.text, category: "personal", note: "", done: false });
    removeNote(id); save(); closeSheet(); render(); haptic("success");
    toast("Поставлено на " + st);
  }

  /* ---------- Самое трудное ---------- */
  function openPickHard() {
    var list = S.focus.filter(function (f) { return !f.done; });
    openSheet(
      '<h2 id="sheetTitle">Что сегодня самое трудное?</h2>' +
      '<p class="sub">Сделай его первым. За него ты получишь двойное сердце.</p>' +
      '<div class="choices">' + list.map(function (f) {
        return choice("set-hard", f.id, ICONS.mountain, f.title, f.hard ? "Отмечено сейчас" : "Выбрать", f.hard ? "is-active" : "");
      }).join("") +
      (S.focus.some(function (f) { return f.hard; }) ? choice("set-hard", "", ICONS.minus, "Без отметки", "Сегодня всё по силам") : "") +
      '</div>'
    );
  }

  /* ---------- Тип дня ---------- */
  function openDayType() {
    openSheet(
      '<h2 id="sheetTitle">Какой сегодня день?</h2>' +
      '<div class="choices">' + S.dayTypes.map(function (d) {
        return choice("set-day", d.id, ICONS.sun, d.label, d.id === S.dayType ? "Выбран сейчас" : "Выбрать", d.id === S.dayType ? "is-active" : "");
      }).join("") + '</div>'
    );
  }

  /* ---------- Моя неделя ---------- */
  function openWeek() {
    var wk = weekStats();
    var diff = wk.hearts - wk.prev;
    var cmp = wk.prev === 0 ? "Прошлой недели пока нет для сравнения"
      : diff > 0 ? "На " + diff + " больше, чем за прошлые 7 дней (" + wk.prev + ")"
      : diff < 0 ? "На " + (-diff) + " меньше, чем за прошлые 7 дней (" + wk.prev + "). Это нормально, неделя ещё идёт"
      : "Столько же, сколько за прошлые 7 дней";
    var hasExample = Object.keys(EXAMPLE_HISTORY).some(function (k) { return k.charAt(0) !== "_"; });
    openSheet(
      '<h2 id="sheetTitle">Моя неделя</h2>' +
      '<div class="wk-big"><b>' + wk.hearts + '</b><span>' + plural(wk.hearts, "сердечко", "сердечка", "сердечек") + ' за 7 дней</span></div>' +
      '<p class="sub" style="margin-top:-6px">' + esc(cmp) + '</p>' +
      '<div class="wk-days">' + wk.days.slice().reverse().map(function (x) {
        var dd = dateOf(x.key);
        var label = x.isToday ? "Сегодня" : dd.toLocaleDateString("ru-RU", { weekday: "short", day: "numeric", month: "short" });
        return '<div class="wk-day' + (x.isToday ? " today" : "") + '"><b>' + esc(label) + '</b>' +
          '<span class="st' + (x.focus ? " on" : "") + '">' + (x.focus ? "Главное закрыто" : (x.known ? "Не всё" : "Нет данных")) + '</span>' +
          '<span class="hc">' + ICONS.heart + x.hearts + '</span></div>';
      }).join("") + '</div>' +
      '<p class="wk-note">Серия мягкая: важно не идеально каждый день, а большинство дней недели.' +
        (hasExample ? ' Прошлые дни пока взяты из примера в data.json.' : '') + '</p>' +
      '<button class="btn-ghost" type="button" data-action="close">Закрыть</button>'
    );
  }

  /* ---------- Вечерний итог ---------- */
  function openReview() {
    var c = counts();
    var r = S.review || {};
    var open = [];
    ["focus", "schedule", "tasks"].forEach(function (list) {
      S[list].forEach(function (x) { if (!x.done) open.push({ list: list, item: x }); });
    });
    var listName = { focus: "Главное", schedule: "По часам", tasks: "Дела" };
    openSheet(
      '<h2 id="sheetTitle">Итог дня</h2>' +
      '<p class="sub">Сделано ' + c.done + ' из ' + c.total + ', ' + heartsToday() + ' ' + plural(heartsToday(), "сердечко", "сердечка", "сердечек") + '</p>' +
      '<label class="q"><span class="field-label">1. Что сегодня получилось?</span>' +
        '<textarea class="short" id="rvGood" maxlength="300" placeholder="Например: провела пробный урок и сняла видео">' + esc(r.good || "") + '</textarea></label>' +
      '<div class="q"><span class="field-label">2. Что переносим на завтра?</span>' +
        (open.length && !S.review
          ? '<div class="checks">' + open.map(function (o) {
              return '<label class="check"><input type="checkbox" checked data-list="' + o.list + '" data-id="' + esc(o.item.id) + '" id="mv-' + esc(o.item.id) + '">' +
                '<span>' + esc(o.item.title) + '<small>' + listName[o.list] + (o.item.time ? ', ' + esc(o.item.time) : '') + '</small></span></label>';
            }).join("") + '</div>'
          : '<p class="sub" style="margin:0">' + (S.review ? "Перенос уже сделан." : "Всё сделано, переносить нечего.") + '</p>') +
      '</div>' +
      '<label class="q"><span class="field-label">3. За что себя похвалю?</span>' +
        '<textarea class="short" id="rvPraise" maxlength="300" placeholder="Например: не сорвалась, когда клиентка опоздала">' + esc(r.praise || "") + '</textarea></label>' +
      '<button class="btn-main" type="button" data-action="review-save">Закрыть день</button>'
    );
  }
  function saveReview() {
    var good = (document.getElementById("rvGood").value || "").trim();
    var praise = (document.getElementById("rvPraise").value || "").trim();
    var moved = S.review ? S.review.moved : 0;
    if (!S.review) {
      var items = [];
      Array.prototype.forEach.call(sheet.querySelectorAll('.check input:checked'), function (inp) {
        var list = inp.getAttribute("data-list"), id = inp.getAttribute("data-id");
        var it = S[list].filter(function (x) { return x.id === id; })[0];
        if (!it) return;
        items.push({ list: list, title: it.title, time: it.time || "" });
        S[list] = S[list].filter(function (x) { return x.id !== id; });
      });
      if (items.length) {
        var t = lsGet(TOMORROW_KEY);
        var prev = t && t.items ? t.items : [];
        lsSet(TOMORROW_KEY, { date: addDays(todayKey(), 1), items: prev.concat(items) });
      }
      moved = items.length;
    }
    S.review = { good: good, praise: praise, moved: moved, at: nowHM() };
    save(); closeSheet(); render(); haptic("success");
    toast(moved ? "День закрыт. На завтра " + moved + " " + plural(moved, "дело", "дела", "дел") : "День закрыт. Отдыхай");
  }

  /* ---------- Отметка выполнения ---------- */
  function toggle(list, id) {
    var item = S[list].filter(function (x) { return x.id === id; })[0];
    if (!item) return;
    item.done = !item.done;
    save(); render();
    haptic(item.done ? "success" : "light");
    if (!item.done) return;
    if (list === "focus" && focusClosed() && !S.finaleShown) {
      S.finaleShown = true; save();
      setTimeout(showFinale, 350);
      return;
    }
    if (list === "focus" && item.hard) { toast("Самое трудное позади! Двойное сердце твоё"); return; }
    var c = counts();
    if (c.done === c.total) toast("Всё сделано! Осталось подвести итог");
  }

  /* ---------- Клики ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var a = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    switch (a) {
      case "toggle": toggle(el.getAttribute("data-list"), id); break;
      case "capture": openCapture(); break;
      case "capture-save": saveCapture(); break;
      case "sort": openSort(id); break;
      case "to-focus": moveToList(id, "focus"); break;
      case "to-tasks": moveToList(id, "tasks"); break;
      case "to-time": openTime(id); break;
      case "time-save": saveTime(id); break;
      case "delete": removeNote(id); save(); closeSheet(); render(); toast("Мысль удалена"); break;
      case "daytype": openDayType(); break;
      case "set-day": S.dayType = id; save(); closeSheet(); render(); haptic(); break;
      case "pick-hard": openPickHard(); break;
      case "set-hard":
        S.focus.forEach(function (f) { f.hard = !!id && f.id === id; });
        save(); closeSheet(); render(); haptic();
        toast(id ? "Начни с него, пока есть силы" : "Отметка снята");
        break;
      case "week": openWeek(); break;
      case "review": openReview(); break;
      case "review-save": saveReview(); break;
      case "card-open": openCardStage(); break;
      case "card-draw": flipCard(); break;
      case "card-skip": cardSkipped = true; closeStage(); break;
      case "card-reset": lsDel(CARD_KEY); cardSkipped = false; render(); openCardStage(); break;
      case "stage-close": closeStage(); break;
      case "close": closeSheet(); break;
      case "retry": load(); break;
      case "blank":
        S = normalize({ today: {} });
        S.dayType = S.dayTypes[0].id; render(); maybeShowCard(); break;
      case "reset":
        lsDel(STORE_KEY);
        if (base) { S = freshDay(); save(); render(); toast("План загружен из файла заново"); }
        else load();
        break;
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { backPressed(); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("back")) { e.preventDefault(); flipCard(); }
  });

  /* Обновлять отметку «Сейчас» раз в минуту */
  setInterval(function () { if (S && !sheetOpen && !stageOpen) render(); }, 60000);

  load();
})();
</script>
<!--BODY-END-->
</body>
</html>
